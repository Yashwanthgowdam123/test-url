name: build-scan-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: |
          IMAGE_LC=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_LC=$IMAGE_LC" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_LC" .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LC }}
          format: json
          output: trivy.json
          exit-code: "0"
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Publish Trivy Summary
        if: always()
        shell: bash
        run: |
          TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy.json)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy.json)
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy.json)

          {
            echo "# 🛡️ Trivy Scan Report"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|------:|"
            echo "| Critical | $CRITICAL |"
            echo "| High | $HIGH |"
            echo "| Medium | $MEDIUM |"
            echo "| Low | $LOW |"
            echo ""
            echo "**Total Vulnerabilities:** $TOTAL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json

      - name: Trivy Quality Gate
        shell: bash
        run: |
          TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          LOW_MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW" or .Severity=="MEDIUM")] | length' trivy.json)
          HIGH_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' trivy.json)

          echo "Total: $TOTAL"
          echo "Low+Medium: $LOW_MEDIUM"
          echo "High+Critical: $HIGH_CRITICAL"

          if [ "$TOTAL" -ge 10 ] || [ "$LOW_MEDIUM" -ge 8 ] || [ "$HIGH_CRITICAL" -ge 2 ]; then
            echo "::error::Trivy vulnerability gate failed"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push "$IMAGE_LC"

  deploy:
    name: Deploy
    needs: build-scan-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        shell: bash
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SSH_HOST }}
          USER_: ${{ secrets.SSH_USER }}
          PW: ${{ secrets.ADMIN_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          IMAGE_LC=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id

          SSH_OPTS="-i $HOME/.ssh/id -o StrictHostKeyChecking=accept-new"

          ssh $SSH_OPTS "$USER_@$HOST" "mkdir -p ~/myurls"

          scp $SSH_OPTS \
            deploy/docker-compose.yml \
            deploy/Caddyfile \
            "$USER_@$HOST:~/myurls/"

          printf '%s' "$GH_TOKEN" | ssh $SSH_OPTS "$USER_@$HOST" \
            "command -v docker >/dev/null || curl -fsSL https://get.docker.com | sudo sh;
             sudo docker login ghcr.io -u $ACTOR --password-stdin"

          ssh $SSH_OPTS "$USER_@$HOST" \
            "cd ~/myurls && \
             umask 077 && \
             printf 'IMAGE=%s\nADMIN_PASSWORD=%s\n' '$IMAGE_LC' '$PW' > .env && \
             sudo docker compose pull && \
             sudo docker compose up -d --remove-orphans && \
             sudo docker image prune -f"
