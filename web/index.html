<style>
:root{
 --bg:#f6f7fb;--sf:#ffffff;--sf2:#f0f2f8;--hd:rgba(255,255,255,.82);
 --tx:#0e1424;--mu:#5d667c;--bd:#e3e7f0;--bd2:#d3d9e6;
 --pr:#2f4bff;--pr-h:#2438d6;--pr-s:#eaedff;--on:#fff;--ring:rgba(47,75,255,.28);
 --dg:#d92d20;--dg-s:#fdecea;--tile:#f0f2f8;
 --sh1:0 1px 2px rgba(14,20,36,.05);
 --sh2:0 1px 2px rgba(14,20,36,.06),0 10px 28px -8px rgba(14,20,36,.16);
 --sh3:0 24px 64px -12px rgba(14,20,36,.35);
 --glow:radial-gradient(60rem 22rem at 50% -8rem,rgba(47,75,255,.10),transparent 70%);
 color-scheme:light}
:root.dark{
 --bg:#0a0c12;--sf:#12151e;--sf2:#1a1e2a;--hd:rgba(10,12,18,.8);
 --tx:#eceff8;--mu:#97a0b8;--bd:#222736;--bd2:#2f3548;
 --pr:#7d95ff;--pr-h:#9aadff;--pr-s:#1b2240;--on:#0a0f26;--ring:rgba(125,149,255,.35);
 --dg:#ff7a70;--dg-s:#2e1715;--tile:#1a1e2a;
 --sh1:0 1px 2px rgba(0,0,0,.4);
 --sh2:0 1px 2px rgba(0,0,0,.5),0 12px 30px -8px rgba(0,0,0,.6);
 --sh3:0 24px 64px -12px rgba(0,0,0,.7);
 --glow:radial-gradient(60rem 22rem at 50% -8rem,rgba(125,149,255,.10),transparent 70%);
 color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;background:var(--glow),var(--bg) fixed;background-repeat:no-repeat}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--hd);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--bd);padding:env(safe-area-inset-top) max(clamp(16px,4vw,48px),env(safe-area-inset-right)) 0 max(clamp(16px,4vw,48px),env(safe-area-inset-left))}
.hd{height:64px;display:grid;grid-template-columns:1fr minmax(0,560px) 1fr;align-items:center;gap:16px;max-width:1400px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.mark{width:32px;height:32px;border-radius:9px;background:var(--pr);color:var(--on);display:grid;place-items:center;flex:none}
.sbox{display:flex;align-items:center;gap:10px;height:42px;padding:0 8px 0 14px;background:var(--sf2);border:1px solid transparent;border-radius:11px;color:var(--mu);transition:background .15s,border-color .15s,box-shadow .15s;min-width:0}
.sbox:hover{border-color:var(--bd2)}
.sbox:focus-within{background:var(--sf);border-color:var(--pr);box-shadow:0 0 0 4px var(--ring)}
.sbox input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;font-size:.95rem;color:var(--tx)}
.sbox input::placeholder{color:var(--mu)}
.sbox input::-webkit-search-cancel-button{display:none}
kbd{font:600 .75rem ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--bd2);border-radius:6px;padding:1px 7px;color:var(--mu);background:var(--sf)}
.tools{display:flex;align-items:center;gap:8px;justify-self:end}
.tg{display:flex;background:var(--sf2);border-radius:10px;padding:3px}
.tg button{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}
.tg button[aria-pressed=true]{background:var(--sf);color:var(--tx);box-shadow:var(--sh1)}
.usr{position:relative}
.ub{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 6px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:11px;font-weight:600;font-size:.9rem;transition:border-color .15s,background .15s}
.ub:hover{border-color:var(--bd2);background:var(--sf2)}
.av{width:26px;height:26px;border-radius:8px;background:var(--pr-s);color:var(--pr);display:grid;place-items:center}
.menu{position:absolute;right:0;top:46px;min-width:200px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh2);padding:6px;display:none}
.menu.open{display:block;animation:pop .14s ease-out}
.menu button{width:100%;min-height:40px;display:flex;gap:10px;align-items:center;padding:0 12px;border:0;border-radius:8px;background:none;text-align:left;font-weight:500}
.menu button:hover{background:var(--sf2)}

/* page */
main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:clamp(28px,5vw,52px) max(clamp(16px,4vw,48px),env(safe-area-inset-left)) 48px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{margin:0;font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem);line-height:1.15;letter-spacing:-.03em;font-weight:700}
.lead{margin:6px 0 0;color:var(--mu);max-width:56ch}
.meta{display:flex;align-items:center;gap:14px}
.pill{color:var(--mu);font-size:.9rem;font-weight:500;white-space:nowrap}
.add{display:none;align-items:center;gap:8px;height:42px;padding:0 18px;border:0;border-radius:11px;background:var(--pr);color:var(--on);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 16px -6px var(--ring);transition:background .15s,transform .12s}
.add:hover{background:var(--pr-h)}.add:active{transform:scale(.97)}
.admin .add{display:flex}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{position:relative;display:flex;align-items:flex-start;gap:14px;min-height:112px;padding:18px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh1);transition:border-color .15s,box-shadow .2s,transform .2s}
@media(hover:hover){.card:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--bd2));box-shadow:var(--sh2);transform:translateY(-2px)}}
.lnk{position:absolute;inset:0;border-radius:14px;z-index:1}
.lnk:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.ic{width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:20px;background:var(--tile);color:var(--tx);border:1px solid var(--bd)}
.ic.l{background:color-mix(in srgb,var(--c) 14%,var(--sf));color:var(--c);border-color:color-mix(in srgb,var(--c) 22%,var(--bd))}
.ic svg{width:30px;height:30px}.ic.t svg{width:26px;height:26px}
:root.dark .ic.l{color:color-mix(in srgb,var(--c) 60%,#fff)}
:root.dark .an circle{fill:#eef2ff}:root.dark .an path{stroke:#111827}
:root.dark .ic svg[fill="#1e3a8a"]{fill:#8fb0ff}
.tx{min-width:0;flex:1;padding-right:22px}
.tx b{display:block;font-size:1rem;font-weight:650;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.host{display:block;color:var(--pr);font-size:.8rem;font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mu);font-size:.9rem;margin-top:6px;line-height:1.4;overflow-wrap:anywhere}
.act{position:absolute;top:10px;right:10px;z-index:2;display:flex;align-items:center;gap:2px}
.ext{color:var(--mu);opacity:0;display:grid;place-items:center;width:28px;height:28px;transition:opacity .15s,color .15s,transform .15s}
.ext svg{width:16px;height:16px}
.card:hover .ext,.card:focus-within .ext{opacity:1;color:var(--pr);transform:translate(1px,-1px)}
.row{display:none;gap:2px}.admin .row{display:flex}
.admin .ext{display:none}
.ib{width:32px;height:32px;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:var(--mu);transition:background .15s,color .15s}
.ib svg{width:17px;height:17px}
.ib:hover{background:var(--sf2);color:var(--tx)}.ib.del:hover{background:var(--dg-s);color:var(--dg)}
@media(hover:hover){.admin .row{opacity:0;transition:opacity .15s}.admin .card:hover .row,.admin .card:focus-within .row{opacity:1}}
@media(pointer:coarse){.ext{opacity:1}.ib{width:40px;height:40px}}
.sk{pointer-events:none}
.sk i{display:block;background:linear-gradient(90deg,var(--sf2),var(--bd),var(--sf2));background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:8px}

.empty{grid-column:1/-1;text-align:center;padding:72px 16px;color:var(--mu);border:1px dashed var(--bd2);border-radius:16px}
.empty svg{color:var(--pr);margin-bottom:12px}.empty h2{margin:0 0 6px;color:var(--tx);font-size:1.15rem}.empty p{margin:0 0 16px}
footer{max-width:1400px;width:100%;margin:0 auto;padding:20px max(clamp(16px,4vw,48px),env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom));position:relative;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mu);font-size:.85rem}
footer::before{content:"";position:absolute;top:0;left:max(clamp(16px,4vw,48px),env(safe-area-inset-left));right:max(clamp(16px,4vw,48px),env(safe-area-inset-right));height:1px;background:var(--bd)}

/* dialogs */
dialog{border:0;padding:0;background:none;color:var(--tx);max-width:none;width:min(520px,calc(100% - 28px));overflow:visible}
dialog::backdrop{background:rgba(8,12,24,.5);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .2s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:clamp(20px,3.5vw,28px);box-shadow:var(--sh3)}
.mh{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.mi{width:40px;height:40px;flex:none;border-radius:11px;background:var(--pr-s);color:var(--pr);display:grid;place-items:center}
.mh h2{margin:0;font-size:1.25rem;letter-spacing:-.02em;line-height:1.25}.mh p{margin:3px 0 0;color:var(--mu);font-size:.92rem}
.x{margin-left:auto;flex:none}
.fld{margin-top:10px}
.fld>label{display:block;font-weight:600;margin-bottom:6px;font-size:.88rem}.fld>label i{color:var(--dg);font-style:normal}
.f{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--bd2);background:var(--sf);border-radius:10px;padding:0 12px;color:var(--mu);transition:border-color .15s,box-shadow .15s}
.f:focus-within{border-color:var(--pr);box-shadow:0 0 0 4px var(--ring)}
.f.bad{border-color:var(--dg)}
.f svg{margin-top:12px;flex:none;width:18px;height:18px}
.f input,.f textarea{flex:1;min-width:0;border:0;outline:0;background:none;height:44px;font-size:.95rem;color:var(--tx)}
.f textarea{height:84px;padding:11px 0;resize:none;line-height:1.45}
.f ::placeholder{color:var(--mu);opacity:.75}
.m{display:flex;justify-content:space-between;gap:10px;min-height:20px;margin-top:5px;font-size:.82rem;color:var(--mu)}
.m .e{color:var(--dg);font-weight:500}
.ft{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.b1,.b2{min-height:42px;padding:0 20px;border-radius:10px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s}
.b1{background:var(--pr);color:var(--on);border:0}.b1:hover{background:var(--pr-h)}.b1[disabled]{opacity:.6;cursor:progress}
.b2{background:var(--sf);border:1px solid var(--bd2)}.b2:hover{background:var(--sf2)}
.b1.dg{background:var(--dg);color:#fff}
.toasts{position:fixed;z-index:60;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;gap:8px;width:max-content;max-width:calc(100% - 28px)}
.ts{background:var(--tx);color:var(--bg);border-radius:11px;padding:11px 16px;box-shadow:var(--sh2);font-weight:500;font-size:.92rem;animation:pop .2s}
.ts.er{background:#b42318;color:#fff}.ts.ok{background:#067647;color:#fff}

/* responsive */
@media(max-width:820px){
 .hd{grid-template-columns:1fr auto;height:auto;padding:12px 0;row-gap:10px}

}
@media(max-width:700px){
 .ub .nm,kbd,.lead{display:none}
 .ub{padding:0 6px}
 .top{align-items:center}
 .add{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));height:54px;padding:0 22px;border-radius:99px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
 main{padding-bottom:96px}
 dialog{width:100%;margin:auto 0 0}.md{border-radius:20px 20px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom))}.ft>*{flex:1}
}
@media(min-width:1900px){html{font-size:17px}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

 cx=\"24\" cy=\"24\" r=\"5\" fill=\"#f58220\"/><path d=\"M24 4v6M24 38v6M4 24h6M38 24h6\" stroke=\"#f58220\" stroke-width=\"3.500\" stroke-linecap=\"round\"/></svg>"}, "prometheus": {"c": "", "s": "<svg viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" r=\"21\" fill=\"#e6522c\"/><path d=\"M24 10c1 6 8 8 8 16a8 8 0 01-16 0c0-4 2-6 4-8 1 2 2 3 3 3 0-4-1-7 1-11z\" fill=\"#fff\"/><path d=\"M17 35h14\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>"}, "sonar": {"c": "", "s": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#4e9bcd\" stroke-width=\"3.500\" stroke-linecap=\"round\"><path d=\"M6 38Q32 36 42 12\"/><path d=\"M6 30Q24 28 34 10\"/><path d=\"M6 22Q16 20 26 8\"/></svg>"}, "trivy": {"c": "", "s": "<svg viewBox=\"0 0 48 48\"><path d=\"M24 5l17 9.500-17 9.500-17-9.500z\" fill=\"#fbbf24\"/><path d=\"M7 14.500L24 24v19L7 33.500z\" fill=\"#2563eb\"/><path d=\"M41 14.500L24 24v19l17-9.500z\" fill=\"#22c55e\"/></svg>"}, "splunk": {"c": "", "s": "<svg viewBox=\"0 0 48 48\"><rect x=\"4\" y=\"4\" width=\"40\" height=\"40\" rx=\"6\" fill=\"#65a637\"/><path d=\"M15 14l17 10-17 10\" stroke=\"#fff\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M24 36h10\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg>"}, "docker": {"c": "", "s": "<svg viewBox=\"0 0 48 48\"><g fill=\"#2496ed\"><rect x=\"9\" y=\"17\" width=\"6\" height=\"5\" rx=\".6\"/><rect x=\"16\" y=\"17\" width=\"6\" height=\"5\" rx=\".6\"/><rect x=\"23\" y=\"17\" width=\"6\" height=\"5\" rx=\".6\"/><rect x=\"16\" y=\"11\" width=\"6\" height=\"5\" rx=\".6\"/><rect x=\"23\" y=\"11\" width=\"6\" height=\"5\" rx=\".6\"/><rect x=\"30\" y=\"17\" width=\"6\" height=\"5\" rx=\".6\"/><path d=\"M3 25h37c2-1 3-3 3-5 3 1 4 3 4 4-1 1-2 2-4 2C39 36 30 42 18 40 9 38 5 32 3 25z\"/></g></svg>"}, "oci": {"c": "", "s": "<svg viewBox=\"0 0 48 48\"><path d=\"M14 37a9 9 0 01-1-18 12 12 0 0123 3 7.500 7.500 0 01-2 15z\" fill=\"none\" stroke=\"#e53935\" stroke-width=\"4\" stroke-linejoin=\"round\"/></svg>"}, "aws": {"c": "", "s": "<svg viewBox=\"0 0 48 48\"><text x=\"24\" y=\"25\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-weight=\"800\" font-size=\"21\" fill=\"currentColor\">aws</text><path d=\"M8 33q16 8 32 0\" stroke=\"#f90\" stroke-width=\"3.500\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M36 28l5 4-6 2\" stroke=\"#f90\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/></svg>"}, "terraform": {"c": "t", "s": "<svg viewBox=\"0 0 48 48\"><path d=\"M4 4l13 7.500v15L4 19z\" fill=\"#5c4ee5\"/><path d=\"M19 12.500l13 7.500v15l-13-7.500z\" fill=\"#5c4ee5\"/><path d=\"M19 -3l13 7.500v15L19 12z\" fill=\"#7b42bc\" transform=\"translate(0 7)\"/><path d=\"M34 20.500L47 13v15l-13 7.500z\" fill=\"#7b42bc\"/></svg>"}, "ansible": {"c": "", "s": "<svg class=\"an\" viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" r=\"21\" fill=\"#1a1a1a\"/><path d=\"M15 36L24 12l9 24M19 28h10\" stroke=\"#fff\" stroke-width=\"4.500\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"}, "portfolio": {"c": "t", "s": "<svg viewBox=\"0 0 48 48\" fill=\"#1e3a8a\"><circle cx=\"24\" cy=\"15\" r=\"8\"/><path d=\"M7 43c0-10 8-15 17-15s17 5 17 15z\"/></svg>"}, "project": {"c": "t", "s": "<svg viewBox=\"0 0 48 48\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"3.500\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M24 6l18 9-18 9-18-9z\"/><path d=\"M6 24l18 9 18-9\"/><path d=\"M6 33l18 9 18-9\"/></svg>"}};
const ALIAS={amazon:'aws',oracle:'oci',sonarqube:'sonar',argocd:'argo'};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}};
function iconFor(n){n=n.toLowerCase();for(const k in ICONS)if(n.includes(k))return ICONS[k];for(const a in ALIAS)if(n.includes(a))return ICONS[ALIAS[a]];return null}

function tile(i){const x=iconFor(i.name);return x?`<div class="ic ${x.c}" aria-hidden="true">${x.s}</div>`:`<div class="ic l" aria-hidden="true">${esc(i.name.trim()[0]||'?').toUpperCase()}</div>`}
function render(){const q=$('q').value.trim().toLowerCase();
 if(!ready){$('g').innerHTML='<div class="card sk"><i style="width:48px;height:48px;border-radius:12px;flex:none"></i><div style="flex:1"><i style="height:14px;width:55%"></i><i style="height:10px;width:35%;margin-top:8px"></i><i style="height:12px;width:85%;margin-top:14px"></i></div></div>'.repeat(8);return}
 const L=D.filter(i=>(i.name+' '+i.desc+' '+i.url).toLowerCase().includes(q));
 $('cnt').textContent=q?`${L.length} of ${D.length}`:`${D.length} ${D.length==1?'application':'applications'}`;
 $('g').innerHTML=L.length?L.map(i=>`<article class="card" style="--c:${esc(i.color||'#2f4bff')}" data-id="${i.id}"><a class="lnk" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(i.name)}"></a>${tile(i)}
 <div class="tx"><b>${esc(i.name)}</b><span class="host">${esc(host(i.url))}</span><small>${esc(i.desc)}</small></div>
 <div class="act"><div class="row"><button class="ib" data-a="e" aria-label="Edit ${esc(i.name)}">${PEN}</button><button class="ib del" data-a="d" aria-label="Delete ${esc(i.name)}">${BIN}</button></div><span class="ext" aria-hidden="true">${EXT}</span></div></article>`).join(''):
 `<div class="empty"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.300-4.300"/></svg><h2>${D.length?'No matches found':'No URLs yet'}</h2><p>${D.length?'Try a different name or description.':(admin?'Add your first application link.':'An admin has not added any links yet.')}</p>${D.length?'<button class="b2" style="margin:auto" id="clr">Clear search</button>':''}</div>`}
function setAdmin(a){admin=a;document.documentElement.classList.toggle('admin',a);$('un').textContent=a?'Admin':'Sign in';
 $('um').innerHTML=a?'<button role="menuitem" id="lo2">Sign out</button>':'<button role="menuitem" id="li">Admin sign in</button>'}
async function load(){render();try{D=await api('GET','/api/urls');setAdmin((await api('GET','/api/me')).admin)}catch{toast('Could not load URLs. Refresh to retry.','er')}ready=true;render()}
const menu=o=>{$('um').classList.toggle('open',o);$('ub').setAttribute('aria-expanded',o)};
$('ub').onclick=e=>{e.stopPropagation();menu(!$('um').classList.contains('open'))};
document.addEventListener('click',()=>menu(false));
$('um').onclick=async e=>{const id=e.target.closest('button')?.id;menu(false);
 if(id=='li'){last=$('ub');$('dl').showModal();$('lp').focus()}
 if(id=='lo2'){await api('POST','/api/logout');setAdmin(false);render();toast('Signed out')}};
document.querySelectorAll('dialog').forEach(d=>{d.addEventListener('click',e=>{if(e.target==d)d.close()});d.addEventListener('close',()=>last&&last.focus?.());d.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>d.close())});
const bad=(b,e,m)=>{$(b).classList.toggle('bad',!!m);$(e).textContent=m||''};
$('lf').onsubmit=async e=>{e.preventDefault();bad('bl','le','');$('ls').disabled=true;
 try{await api('POST','/api/login',{password:$('lp').value});$('dl').close();$('lp').value='';setAdmin(true);render();toast('Signed in as Admin','ok')}catch{bad('bl','le','Wrong password. Try again.');$('lp').select()}$('ls').disabled=false};
function openM(i){edit=i;last=document.activeElement;$('mt').textContent=i?'Edit URL':'Add New URL';$('ms').textContent=i?'Update this link on the dashboard.':'Add a new application or project link to the dashboard.';
 $('fn').value=i?i.name:'';$('fu').value=i?i.url:'';$('fd').value=i?i.desc:'';$('cc').textContent=$('fd').value.length+' / 120';['n','u','d'].forEach(k=>bad('b'+k,'e'+k,''));$('dm').showModal();$('fn').focus()}
$('addb').onclick=()=>openM(null);$('fd').oninput=()=>$('cc').textContent=$('fd').value.length+' / 120';
$('fm').onsubmit=async e=>{e.preventDefault();let u=$('fu').value.trim();if(u&&!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u='https://'+u;
 const b={name:$('fn').value.trim(),url:u,desc:$('fd').value.trim()};let ok=true,v;
 v=b.name?'':'Enter an application name.';bad('bn','en',v);ok&&=!v;
 try{new URL(b.url);v=/^https?:\/\/[^\s.]+\.?[^\s]*$/i.test(b.url)?'':'Use an http:// or https:// address.'}catch{v='Enter a valid address, e.g. https://example.com'}bad('bu','eu',v);ok&&=!v;
 v=b.desc?'':'Add a short description.';bad('bd','ed',v);ok&&=!v;
 if(!ok){document.querySelector('.f.bad input,.f.bad textarea')?.focus();return}
 $('fu').value=u;$('sv').disabled=true;$('sv').lastElementChild.textContent='Saving…';
 try{edit?await api('PUT','/api/urls/'+edit.id,b):await api('POST','/api/urls',b);$('dm').close();D=await api('GET','/api/urls');render();toast(edit?'Changes saved':'URL added','ok')}
 catch(r){if(r.status==401){$('dm').close();setAdmin(false);render();toast('Session expired. Sign in again.','er');$('dl').showModal()}else toast('Could not save. Please try again.','er')}
 $('sv').disabled=false;$('sv').lastElementChild.textContent='Save URL'};
$('g').onclick=e=>{if(e.target.id=='clr'){$('q').value='';render();$('q').focus();return}
 const b=e.target.closest('[data-a]');if(!b)return;const i=D.find(x=>x.id==b.closest('.card').dataset.id);
 if(b.dataset.a=='e')openM(i);else{del=i;last=b;$('dn').textContent=`“${i.name}” will be removed from the dashboard.`;$('dd').showModal()}};
$('df').onsubmit=async()=>{if(!del)return;try{await api('DELETE','/api/urls/'+del.id);D=D.filter(x=>x.id!=del.id);render();toast('URL deleted')}catch{toast('Could not delete.','er')}};
$('q').oninput=render;
addEventListener('keydown',e=>{const t=e.target.tagName;if(e.key=='/'&&!/INPUT|TEXTAREA/.test(t)&&!document.querySelector('dialog[open]')){e.preventDefault();$('q').focus()}
 if(e.key=='Escape'){menu(false);if(e.target==$('q')&&$('q').value){$('q').value='';render()}}});
const sm=matchMedia('(max-width:700px)'),ph=()=>$('q').placeholder=sm.matches?'Search applications...':'Search application or description...';ph();sm.onchange=ph;
const mq=matchMedia('(prefers-color-scheme:dark)');
function theme(d,keep){document.documentElement.classList.toggle('dark',d);$('lt').setAttribute('aria-pressed',!d);$('dt').setAttribute('aria-pressed',d);$('tc').content=d?'#0a0c12':'#ffffff';if(keep)try{localStorage.t=d?'d':'l'}catch{}}
$('lt').onclick=()=>theme(false,1);$('dt').onclick=()=>theme(true,1);
mq.onchange=e=>{try{if(!localStorage.t)theme(e.matches)}catch{}};
theme(document.documentElement.classList.contains('dark'));
load();
</script></body></html>
